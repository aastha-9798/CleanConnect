                    <form class="fm" id="driveForm">
                        <label for="description">Event Description:</label>
                        <textarea id="description" name="description" placeholder="Describe your cleanup event" style="padding: 8px; border-radius: 5px; border: 1px solid #ccc; min-height: 80px;"></textarea>
                        <label for="scheduled_at">Event Date & Time:</label>
                        <input type="datetime-local" id="scheduled_at" name="scheduled_at" required>
                        <label for="report_id">Select Report Location:</label>
                        <select id="report_id" name="report_id" required style="padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
                            <option value="">-- Loading reports... --</option>
                        </select>
                        <div id="reportInfo" style="background-color: #f5f5f5; padding: 10px; border-radius: 5px; display: none;">
                            <p><strong>Selected Report:</strong></p>
                            <p id="reportPreview"></p>

    <script>
        let reportsData = {};

        // Load reports when page loads
        document.addEventListener('DOMContentLoaded', async function() {
            await loadMyReports();
            setupFormHandler();
        });

        async function loadMyReports() {
            try {
                const token = localStorage.getItem('access_token');
                if (!token) {
                    alert('Please log in to create a cleanup drive.');
                    window.location.href = 'login.html';
                    return;
                }

                const response = await fetch('/user/me/reports', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Failed to load reports: ${response.statusText}`);
                }

                const reports = await response.json();
                const selectElement = document.getElementById('report_id');
                selectElement.innerHTML = '<option value="">-- Select a report location --</option>';

                if (reports.length === 0) {
                    selectElement.innerHTML += '<option value="" disabled>No reports available. Create a report first.</option>';
                    return;
                }

                reports.forEach(report => {
                    reportsData[report.id] = report;
                    const option = document.createElement('option');
                    option.value = report.id;
                    const dateStr = new Date(report.created_at).toLocaleDateString();
                    option.textContent = `Report #${report.id} - ${report.description || 'No description'} (${dateStr})`;
                    selectElement.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading reports:', error);
                alert('Failed to load reports. Please try again.');
            }
        }

        function setupFormHandler() {
            const form = document.getElementById('driveForm');
            const reportSelect = document.getElementById('report_id');

            // Show report preview when a report is selected
            reportSelect.addEventListener('change', function() {
                const reportInfo = document.getElementById('reportInfo');
                const reportPreview = document.getElementById('reportPreview');
                
                if (this.value && reportsData[this.value]) {
                    const report = reportsData[this.value];
                    reportPreview.innerHTML = `
                        <strong>ID:</strong> ${report.id}<br>
                        <strong>Description:</strong> ${report.description || 'N/A'}<br>
                        <strong>Location:</strong> Lat: ${report.latitude}, Lon: ${report.longitude}<br>
                        <strong>Status:</strong> ${report.status}
                    `;
                    reportInfo.style.display = 'block';
                } else {
                    reportInfo.style.display = 'none';
                }
            });

            // Handle form submission
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                await createDrive();
            });
        }

        async function createDrive() {
            try {
                const token = localStorage.getItem('access_token');
                if (!token) {
                    alert('Please log in to create a cleanup drive.');
                    window.location.href = 'login.html';
                    return;
                }

                const reportId = document.getElementById('report_id').value;
                const description = document.getElementById('description').value;
                const scheduledAt = document.getElementById('scheduled_at').value;

                if (!reportId) {
                    alert('Please select a report location.');
                    return;
                }

                if (!description.trim()) {
                    alert('Please enter an event description.');
                    return;
                }

                if (!scheduledAt) {
                    alert('Please select a date and time for the event.');
                    return;
                }

                // Convert local datetime to ISO 8601 UTC format
                const dateObj = new Date(scheduledAt);
                const isoString = dateObj.toISOString();

                const payload = {
                    report_id: parseInt(reportId),
                    description: description.trim(),
                    scheduled_at: isoString
                };

                const response = await fetch('/drives/', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || `Failed to create drive: ${response.statusText}`);
                }

                const result = await response.json();
                alert(`Cleanup event created successfully! Event ID: ${result.id}`);
                
                // Reset form
                document.getElementById('driveForm').reset();
                document.getElementById('reportInfo').style.display = 'none';
            } catch (error) {
                console.error('Error creating drive:', error);
                alert(`Error creating cleanup event: ${error.message}`);
            }
        }

        function logout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            localStorage.removeItem('token_type');
            localStorage.removeItem('user_email');
            window.location.href = 'login.html';
        }
